name: Previa do post (nao publica)

# Gera o proximo post do feed e do story exatamente como o robo faria,
# mas NAO publica. O resultado fica como artefato da rodada.

on:
  workflow_dispatch:
    inputs:
      carrossel:
        description: "Gerar como carrossel (formato do post das 12h)"
        type: boolean
        default: true
      estilo:
        description: "sabia (12h) ou mito (18h)"
        type: choice
        options: ["sabia", "mito"]
        default: "sabia"

permissions:
  contents: write

jobs:
  previa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - name: Gerar sem publicar
        env:
          ID: ${{ secrets.IG_USER_ID }}
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python postador.py --previa ${{ inputs.carrossel && '--carrossel' || '' }} --estilo ${{ inputs.estilo || 'sabia' }}
      - name: Guardar a previa no branch previa
        run: |
          git config user.name "FisioSync Robo"
          git config user.email "robo@users.noreply.github.com"
          git checkout -B previa
          git add -f gerado/
          git commit -qm "previa $(date -u +%F-%H%M)" || exit 0
          git push -qf origin previa
