name: Reels - publicar

# Publica no Instagram um Reels ja montado e conferido, usando as chaves
# do Instagram que este robo ja tem. O video vem em reels/*.mp4 com o
# roteiro (e a legenda) no .json de mesmo nome.

on:
  workflow_dispatch:
    inputs:
      nome:
        description: "Nome do Reels (ex: 15-dez-segundos-num-pe-so). Procura o video em reels/prontos e o roteiro em reels/fila"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: reels-publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar ffmpeg (a capa e calculada pela duracao do video)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Publicar no Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          NOME: ${{ inputs.nome }}
        run: |
          set -e
          VIDEO="reels/prontos/$NOME.mp4"; [ -f "$VIDEO" ] || VIDEO="reels/$NOME.mp4"
          ROTEIRO="reels/fila/$NOME.json"; [ -f "$ROTEIRO" ] || ROTEIRO="reels/$NOME.json"
          test -f "$VIDEO" && test -f "$ROTEIRO"
          echo "video: $VIDEO | roteiro: $ROTEIRO"
          export VIDEO ROTEIRO
          node reels/publicar.mjs
      - name: Guardar o historico
        run: |
          git config user.name "FisioSync Robo"
          git config user.email "robo@users.noreply.github.com"
          git add reels/historico-reels.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "reels publicado em $(date -u +%F-%H%M)"
          git pull --rebase --autostash || true
          git push
