name: Metricas do Instagram

# Le curtidas, comentarios, alcance, envios e salvamentos dos posts e
# grava o relatorio em metricas/. Toda segunda abre um aviso (vira
# e-mail) com o resumo da semana.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"   # segunda, 09:00 em Brasilia

permissions:
  contents: write
  issues: write

concurrency:
  group: metricas
  cancel-in-progress: false

jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Ler as metricas
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python metricas.py
      - name: Guardar
        run: |
          git config user.name "FisioSync Robo"
          git config user.email "robo@users.noreply.github.com"
          git add metricas
          git diff --cached --quiet && exit 0
          git commit -m "metricas de $(date -u +%F)"
          for t in 1 2 3 4 5; do git push && exit 0; git pull --rebase --autostash || true; sleep $((t*3)); done
          exit 1
      - name: Mandar o resumo da semana
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Instagram - resumo da semana ($(date -u +%F))" \
            --body-file metricas/RELATORIO.md || true
