name: Posts diarios da FisioSync

# DOIS posts por dia: 12:00 e 18:00 em Brasilia. Cada um leva 1 post no
# feed + 1 story do mesmo tema, e consome 1 pauta do banco.
#
# O CRON DO GITHUB NAO MARCA A HORA. Medido neste repositorio:
#
#   31/10  cron 11:55 -> rodou 15:52       (3h57 atrasado)
#   31/10  cron 18:25 -> nunca rodou
#   01/11  6 crons entre 09:30 e 13:30 -> ZERO em 5h30
#   01/11  6 crons entre 18:20 e 20:40 -> 3 rodaram, 1h a 3h atrasados
#
# O buraco e de dia: 12h as 17h UTC e o pico da fila do GitHub, e e
# exatamente onde cai o nosso meio-dia. De madrugada ele dispara.
#
# Por isso a largada vem da MADRUGADA e o robo ESPERA ate a hora certa.
# Como um job morre em 6 horas, a espera e uma corrente de cinco
# etapas, nenhuma com mais de 4 horas de sono:
#
#   madrugada   dorme ate 05:00
#   manha_cedo  dorme ate 09:00
#   manha       dorme ate 12:00  e PUBLICA
#   tarde_cedo  dorme ate 15:30
#   tarde       dorme ate 18:00  e PUBLICA
#
# Uma largada a 01:00 cobre os dois posts do dia. Largada mais tarde
# entra no meio da corrente. Cada etapa roda mesmo se a anterior
# falhar, por causa do if: always().
#
# Travas contra post duplicado: o espera.py confere o historico antes e
# depois de dormir, o postador.py confere de novo antes de gastar API, e
# o grupo de concorrencia mantem uma corrente por vez.
#
# Para testar sem esperar: aba Actions > Run workflow (ignora o relogio).
# Para pausar: aba Actions > este workflow > Disable workflow.

on:
  schedule:
    # madrugada: e quando o agendador do GitHub realmente responde
    - cron: "0 4 * * *"      # 01:00 em Brasilia
    - cron: "0 6 * * *"      # 03:00
    - cron: "0 8 * * *"      # 05:00
    - cron: "30 9 * * *"     # 06:30
    # manha, se nenhuma largada da madrugada pegou
    - cron: "30 11 * * *"    # 08:30
    - cron: "30 13 * * *"    # 10:30
    - cron: "40 14 * * *"    # 11:40
    # ultimas chances do dia
    - cron: "20 16 * * *"    # 13:20
    - cron: "0 20 * * *"     # 17:00
  workflow_dispatch:
    inputs:
      agora:
        description: "Publicar na hora, sem esperar o relogio"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: post-diario
  cancel-in-progress: false

env:
  # "Run workflow" publica na hora por padrao, que e o que se espera de
  # um botao. Desmarcando a caixa, a corrente larga agora mas respeita
  # o relogio: serve para recuperar uma janela que ainda nao chegou.
  # No agendamento o input vem vazio, entao vale 0.
  FORCAR: ${{ inputs.agora && '1' || '0' }}

jobs:
  madrugada:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python espera.py --etapa madrugada

  manha_cedo:
    needs: madrugada
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python espera.py --etapa manha_cedo

  manha:
    needs: manha_cedo
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow

      - name: Esperar o meio-dia
        id: relogio
        run: python espera.py --etapa manha

      - name: Gerar e publicar
        if: steps.relogio.outputs.publicar == 'sim'
        env:
          ID: ${{ secrets.IG_USER_ID }}
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python postador.py

      - name: Avisar se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash aviso_falha.sh

      - name: Guardar historico e pautas
        if: steps.relogio.outputs.publicar == 'sim'
        run: bash guardar.sh

  tarde_cedo:
    needs: manha
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python espera.py --etapa tarde_cedo

  tarde:
    needs: tarde_cedo
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow

      - name: Esperar as 18:00
        id: relogio
        run: python espera.py --etapa tarde

      - name: Gerar e publicar
        if: steps.relogio.outputs.publicar == 'sim'
        env:
          ID: ${{ secrets.IG_USER_ID }}
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python postador.py

      - name: Avisar se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash aviso_falha.sh

      - name: Guardar historico e pautas
        if: steps.relogio.outputs.publicar == 'sim'
        run: bash guardar.sh

  # ---------------------------------------------------------------------
  # REELS DIARIO, ~20:00
  #
  # Pega o proximo roteiro da fila (reels/fila), que so tem fato
  # conferido em fonte oficial; gera a narracao, a trilha e o video;
  # confere quadro a quadro e as regras do Reels; e publica. Nada de
  # conteudo de saude escrito por IA na hora: a fila e feita antes.
  # ---------------------------------------------------------------------
  reels:
    needs: tarde
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install requests pillow numpy scipy

      - name: Esperar as 19:50
        id: relogio
        run: python espera.py --etapa reels

      - name: Escolher o roteiro de hoje
        id: fila
        if: steps.relogio.outputs.publicar == 'sim'
        run: python3 reels/proximo.py

      - uses: oven-sh/setup-bun@v2
        if: steps.relogio.outputs.publicar == 'sim'
        with:
          bun-version: latest

      - name: Instalar ffmpeg
        if: steps.relogio.outputs.publicar == 'sim'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Montar e conferir o video
        if: steps.relogio.outputs.publicar == 'sim'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ROTEIRO: reels/roteiro-hoje.json
        run: |
          set -e
          node reels/narrar.mjs
          python3 reels/musica.py
          ( cd remotion && bun install )
          export SAIDA="$GITHUB_WORKSPACE/reels/saida-hoje.mp4" COMPOSICAO=reel-dica
          limpo=nao
          for tentativa in 1 2 3; do
            ( cd remotion && bun run scripts/render-reel.mjs )
            if python3 reels/piscadas.py "$SAIDA"; then limpo=sim; break; fi
            echo "quadro quebrado na tentativa $tentativa, renderizando de novo"
          done
          [ "$limpo" = sim ] || { echo "FALHOU: tres renders com quadro quebrado"; exit 1; }

          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$SAIDA")
          DIM=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
                -of csv=p=0 "$SAIDA" | tr -d '\r\n ' | sed 's/,*$//')
          AUD=$(ffprobe -v error -select_streams a -show_entries stream=codec_name \
                -of csv=p=0 "$SAIDA" | head -1)
          echo "duracao ${DUR}s | ${DIM} | audio ${AUD:-NENHUM}"
          awk -v d="$DUR" 'BEGIN{ if (d<8 || d>15.05) exit 1 }' || { echo "FALHOU: passou de 15s"; exit 1; }
          [ "$DIM" = "1080,1920" ] || { echo "FALHOU: nao e 1080x1920"; exit 1; }
          [ -n "$AUD" ] || { echo "FALHOU: sem audio"; exit 1; }

      - name: Publicar no Instagram
        if: steps.relogio.outputs.publicar == 'sim'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO: reels/saida-hoje.mp4
          ROTEIRO: reels/roteiro-hoje.json
        run: node reels/publicar.mjs

      - name: Guardar o historico do Reels
        if: steps.relogio.outputs.publicar == 'sim'
        run: |
          git config user.name "FisioSync Robo"
          git config user.email "robo@users.noreply.github.com"
          git add reels/historico-reels.json
          git diff --cached --quiet && exit 0
          git commit -m "reels publicado em $(date -u +%F-%H%M)"
          for t in 1 2 3 4 5; do git push && exit 0; git pull --rebase --autostash || true; sleep $((t*3)); done
          exit 1

      - name: Avisar que a fila esta acabando
        if: steps.fila.outputs.fila_baixa == 'sim'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Fila de Reels acabando ($(date -u +%F))" \
            --body "Restam menos de 5 roteiros conferidos em reels/fila. Hora de conferir fatos novos em fonte oficial (reels/temas/REGRAS.md)." || true

      - name: Avisar se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash aviso_falha.sh
