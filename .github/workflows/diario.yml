name: Post diario da FisioSync

# Uma vez por dia: 1 post no feed + 1 story do mesmo tema.
#
# 15:30 UTC = 12:30 em Brasilia. O intervalo do almoco e quando o
# fisioterapeuta para entre atendimentos.
#
# Para testar sem esperar, use a aba Actions e o botao Run workflow.
#
# Para mudar o horario, troque o numero do cron. Lembre que ele e em
# UTC: Brasilia e UTC-3, entao 12:30 daqui e 15:30 la.
#   07:30 Brasilia -> "30 10 * * *"
#   19:30 Brasilia -> "30 22 * * *"
#
# Para pausar: aba Actions > este workflow > Disable workflow.

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow

      - name: Gerar e publicar
        env:
          ID: ${{ secrets.IG_USER_ID }}
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python postador.py

      - name: Guardar historico e pautas
        run: |
          git config user.name "FisioSync Robo"
          git config user.email "robo@users.noreply.github.com"
          git add historico.json pautas.json || true
          git commit -m "registro do post de $(date +%F)" || exit 0
          git push
