name: Posts diarios da FisioSync

# DUAS publicacoes por dia. Cada uma leva 1 post no feed + 1 story do
# mesmo tema, e consome 1 pauta do banco.
#
# Os horarios estao 5 minutos ANTES do alvo de proposito. O agendador do
# GitHub nao e pontual: em horario cheio ele costuma atrasar de 5 a 20
# minutos, porque e quando todo mundo agenda. Pedindo 11:55 e 18:25, a
# publicacao cai perto de 12:00 e 18:30.
#
#   14:55 UTC = 11:55 em Brasilia  -> alvo 12:00
#   21:25 UTC = 18:25 em Brasilia  -> alvo 18:30
#
# Para voltar a 1 post por dia, apague uma das duas linhas de cron.
# Para testar sem esperar: aba Actions > Run workflow.
# Para pausar: aba Actions > este workflow > Disable workflow.

on:
  schedule:
    - cron: "55 14 * * *"
    - cron: "25 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # se uma rodada atrasar e encostar na outra, a segunda espera em vez
  # de rodar junto e baguncar o historico
  group: post-diario
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow

      - name: Gerar e publicar
        env:
          ID: ${{ secrets.IG_USER_ID }}
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python postador.py

      - name: Avisar se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create             --title "O post de $(date -u +%F) falhou"             --body "A rodada automatica nao publicou.

          Veja o log em: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Causas mais comuns, em ordem:
          1. Token do Instagram expirado. Gere outro no Business Manager e
             atualize o segredo IG_ACCESS_TOKEN.
          2. Credito da OpenAI acabou. Veja em platform.openai.com.
          3. A Meta recusou a imagem ou esta fora do ar. Costuma passar
             sozinho na proxima rodada." || true

      - name: Guardar historico e pautas
        run: |
          git config user.name "FisioSync Robo"
          git config user.email "robo@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add historico.json pautas.json || true
          git commit -m "registro do post de $(date -u +%F-%H%M)" || exit 0
          git push
