name: Posts diarios da FisioSync

# DOIS posts por dia: 12:00 e 18:00 em Brasilia. Cada um leva 1 post no
# feed + 1 story do mesmo tema, e consome 1 pauta do banco.
#
# O CRON DO GITHUB NAO MARCA A HORA. Medido neste repositorio:
#
#   31/10  cron 11:55 -> rodou 15:52       (3h57 atrasado)
#   31/10  cron 18:25 -> nunca rodou
#   01/11  6 crons entre 09:30 e 13:30 -> ZERO em 5h30
#   01/11  6 crons entre 18:20 e 20:40 -> 3 rodaram, 1h a 3h atrasados
#
# O buraco e de dia: 12h as 17h UTC e o pico da fila do GitHub, e e
# exatamente onde cai o nosso meio-dia. De madrugada ele dispara.
#
# Por isso a largada vem da MADRUGADA e o robo ESPERA ate a hora certa.
# Como um job morre em 6 horas, a espera e uma corrente de cinco
# etapas, nenhuma com mais de 4 horas de sono:
#
#   madrugada   dorme ate 05:00
#   manha_cedo  dorme ate 09:00
#   manha       dorme ate 12:00  e PUBLICA
#   tarde_cedo  dorme ate 15:30
#   tarde       dorme ate 18:00  e PUBLICA
#
# Uma largada a 01:00 cobre os dois posts do dia. Largada mais tarde
# entra no meio da corrente. Cada etapa roda mesmo se a anterior
# falhar, por causa do if: always().
#
# Travas contra post duplicado: o espera.py confere o historico antes e
# depois de dormir, o postador.py confere de novo antes de gastar API, e
# o grupo de concorrencia mantem uma corrente por vez.
#
# Para testar sem esperar: aba Actions > Run workflow (ignora o relogio).
# Para pausar: aba Actions > este workflow > Disable workflow.

on:
  schedule:
    # madrugada: e quando o agendador do GitHub realmente responde
    - cron: "0 4 * * *"      # 01:00 em Brasilia
    - cron: "0 6 * * *"      # 03:00
    - cron: "0 8 * * *"      # 05:00
    - cron: "30 9 * * *"     # 06:30
    # manha, se nenhuma largada da madrugada pegou
    - cron: "30 11 * * *"    # 08:30
    - cron: "30 13 * * *"    # 10:30
    - cron: "40 14 * * *"    # 11:40
    # ultimas chances do dia
    - cron: "20 16 * * *"    # 13:20
    - cron: "0 20 * * *"     # 17:00
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: post-diario
  cancel-in-progress: false

env:
  FORCAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

jobs:
  madrugada:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python espera.py --etapa madrugada

  manha_cedo:
    needs: madrugada
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python espera.py --etapa manha_cedo

  manha:
    needs: manha_cedo
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow

      - name: Esperar o meio-dia
        id: relogio
        run: python espera.py --etapa manha

      - name: Gerar e publicar
        if: steps.relogio.outputs.publicar == 'sim'
        env:
          ID: ${{ secrets.IG_USER_ID }}
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python postador.py

      - name: Avisar se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash aviso_falha.sh

      - name: Guardar historico e pautas
        if: steps.relogio.outputs.publicar == 'sim'
        run: bash guardar.sh

  tarde_cedo:
    needs: manha
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python espera.py --etapa tarde_cedo

  tarde:
    needs: tarde_cedo
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow

      - name: Esperar as 18:00
        id: relogio
        run: python espera.py --etapa tarde

      - name: Gerar e publicar
        if: steps.relogio.outputs.publicar == 'sim'
        env:
          ID: ${{ secrets.IG_USER_ID }}
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python postador.py

      - name: Avisar se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash aviso_falha.sh

      - name: Guardar historico e pautas
        if: steps.relogio.outputs.publicar == 'sim'
        run: bash guardar.sh
