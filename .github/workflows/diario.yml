name: Posts diarios da FisioSync

# DOIS posts por dia: 12:00 (carrossel "Voce sabia?") e 18:00 (carrossel
# "Mito ou verdade?"), em Brasilia. Cada um leva 1 post no feed + 1 story do mesmo tema, e
# consome 1 pauta de conhecimento conferida do banco.
#
# O CRON DO GITHUB NAO MARCA A HORA. Medido neste repositorio:
#
#   31/10  cron 11:55 -> rodou 15:52       (3h57 atrasado)
#   31/10  cron 18:25 -> nunca rodou
#   01/11  6 crons entre 09:30 e 13:30 -> ZERO em 5h30
#   01/11  6 crons entre 18:20 e 20:40 -> 3 rodaram, 1h a 3h atrasados
#
# O buraco e de dia: 12h as 17h UTC e o pico da fila do GitHub, e e
# exatamente onde cai o nosso meio-dia. De madrugada ele dispara.
#
# Por isso a largada vem da MADRUGADA e o robo ESPERA ate a hora certa.
# Como um job morre em 6 horas, a espera e uma corrente de cinco
# etapas, nenhuma com mais de 4 horas de sono:
#
#   madrugada   dorme ate 05:00
#   manha_cedo  dorme ate 08:00
#   manha       dorme ate 12:00  e PUBLICA
#   tarde_cedo  dorme ate 15:30
#   tarde       dorme ate 18:00  e PUBLICA
#   reels       monta 19:45     e PUBLICA o Reels as 20:00
#
# Uma largada a 01:00 cobre os dois posts do dia. Largada mais tarde
# entra no meio da corrente. Cada etapa roda mesmo se a anterior
# falhar, por causa do if: ${{ !cancelled() }}.
#
# Travas contra post duplicado: o espera.py confere o historico antes e
# depois de dormir, o postador.py confere de novo antes de gastar API, e
# o grupo de concorrencia mantem uma corrente por vez.
#
# Para testar sem esperar: aba Actions > Run workflow (ignora o relogio).
# Para pausar: aba Actions > este workflow > Disable workflow.

on:
  schedule:
    # madrugada: e quando o agendador do GitHub realmente responde
    - cron: "0 4 * * *"      # 01:00 em Brasilia
    - cron: "0 6 * * *"      # 03:00
    - cron: "0 8 * * *"      # 05:00
    - cron: "30 9 * * *"     # 06:30
    # manha, se nenhuma largada da madrugada pegou
    - cron: "30 11 * * *"    # 08:30
    - cron: "30 13 * * *"    # 10:30
    - cron: "40 14 * * *"    # 11:40
    # ultimas chances do dia
    - cron: "20 16 * * *"    # 13:20
    - cron: "0 20 * * *"     # 17:00
  workflow_dispatch:
    inputs:
      agora:
        description: "Publicar na hora, sem esperar o relogio"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: post-diario
  cancel-in-progress: false

env:
  # "Run workflow" publica na hora por padrao, que e o que se espera de
  # um botao. Desmarcando a caixa, a corrente larga agora mas respeita
  # o relogio: serve para recuperar uma janela que ainda nao chegou.
  # No agendamento o input vem vazio, entao vale 0.
  FORCAR: ${{ inputs.agora && '1' || '0' }}

jobs:
  madrugada:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python espera.py --etapa madrugada

  manha_cedo:
    needs: madrugada
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python espera.py --etapa manha_cedo

  manha:
    needs: manha_cedo
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow

      - name: Esperar o meio-dia
        id: relogio
        run: python espera.py --etapa manha

      - name: Gerar e publicar
        if: steps.relogio.outputs.publicar == 'sim'
        env:
          ID: ${{ secrets.IG_USER_ID }}
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 12h e carrossel (o formato que mais e salvo); 18h e post unico
        run: python postador.py --carrossel

      - name: Avisar se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash aviso_falha.sh

      - name: Guardar historico e pautas
        if: steps.relogio.outputs.publicar == 'sim'
        run: bash guardar.sh

  tarde_cedo:
    needs: manha
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python espera.py --etapa tarde_cedo

  tarde:
    needs: tarde_cedo
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow

      - name: Esperar as 18:00
        id: relogio
        run: python espera.py --etapa tarde

      - name: Gerar e publicar
        if: steps.relogio.outputs.publicar == 'sim'
        env:
          ID: ${{ secrets.IG_USER_ID }}
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python postador.py --carrossel --estilo mito

      - name: Avisar se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash aviso_falha.sh

      - name: Guardar historico e pautas
        if: steps.relogio.outputs.publicar == 'sim'
        run: bash guardar.sh

  # ---------------------------------------------------------------------
  # REELS, UM POR DIA: 20h (decisao de 02/11/2026: 1 Reels + 2 carrosseis.
  # Um Reels forte rende mais que dois medianos e a fila de fatos rende o
  # dobro.)
  #
  # Cada um pega o proximo roteiro da fila (reels/fila), que so tem fato
  # conferido em fonte oficial; monta, confere quadro a quadro e as regras
  # do Reels, espera o minuto exato e publica. A logica fica em
  # .github/actions/reels, a mesma para os dois horarios.
  # ---------------------------------------------------------------------
  reels:
    needs: tarde
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/reels
        with:
          etapa: reels
          publicar_as: "20:00"
          janela: noite
          elevenlabs_key: ${{ secrets.ELEVENLABS_API_KEY }}
          voice_id: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ig_user_id: ${{ secrets.IG_USER_ID }}
          ig_token: ${{ secrets.IG_ACCESS_TOKEN }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Avisar se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash aviso_falha.sh

  # ---------------------------------------------------------------------
  # ESTOQUE: no fim do dia, conta quantos dias de conteudo conferido
  # sobram. Abaixo de 10 dias (feed ou Reels), abre um aviso que chega
  # por e-mail, uma vez so, ate alguem abastecer.
  # ---------------------------------------------------------------------
  estoque:
    needs: reels
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Contar o estoque
        id: conta
        run: |
          git pull -q origin "${GITHUB_REF_NAME}" || true
          set +e
          python estoque.py
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
      - name: Avisar se estiver acabando
        if: steps.conta.outputs.codigo == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUMO: ${{ steps.conta.outputs.resumo }}
        run: |
          TITULO="Conteudo conferido acabando: abastecer o banco"
          if gh issue list --state open --search "$TITULO in:title" --json number -q '.[0].number' | grep -q .; then
            echo "aviso ja aberto"; exit 0
          fi
          gh issue create --title "$TITULO" --body "$(printf '%s\n\n%s\n\n%s' \
            "Menos de 10 dias de conteudo conferido em fonte oficial." \
            "$RESUMO" \
            "Abra uma conversa com o Claude e peca: abastecer o banco de fatos (feed e Reels) a partir da lista de temas, conferindo cada fato em fonte oficial.")"
