name: Posts diarios da FisioSync

# DUAS publicacoes por dia. Cada uma leva 1 post no feed + 1 story do
# mesmo tema, e consome 1 pauta do banco.
#
# O CRON NAO MARCA MAIS A HORA
#
# Medido neste repositorio: o agendador do GitHub atrasou 3h57 uma vez,
# pulou a janela inteira outra, e em 01/11 ignorou sete gatilhos
# seguidos. Pedir pontualidade a ele nao funciona.
#
# Entao o cron virou so a LARGADA. Ele dispara em algum momento das
# 2h30 que antecedem o alvo, e o espera.py dorme ate a hora certa antes
# de liberar a publicacao. Cron que atrasou 40 minutos continua
# publicando as 12:00 em ponto, porque quem marca a hora e o sleep.
#
#   alvo da manha: 15:00 UTC = 12:00 em Brasilia
#   alvo da tarde: 21:30 UTC = 18:30 em Brasilia
#
# Os dois ultimos crons de cada janela caem DEPOIS do alvo de proposito:
# se tudo antes falhar, eles publicam atrasado, que e melhor que nao
# publicar.
#
# Duas travas impedem post duplicado: o espera.py encerra em segundos se
# a janela de hoje ja saiu, e o postador.py confere de novo antes de
# gastar API. O grupo de concorrencia garante uma rodada por vez.
#
# Para voltar a 1 post por dia, apague os crons da janela da tarde.
# Para testar sem esperar: aba Actions > Run workflow.
# Para pausar: aba Actions > este workflow > Disable workflow.

on:
  schedule:
    # largadas da manha: 09:30 -> 13:30 em Brasilia, alvo 12:00
    - cron: "30 12 * * *"
    - cron: "20 13 * * *"
    - cron: "10 14 * * *"
    - cron: "50 14 * * *"
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"
    # largadas da tarde: 16:00 -> 20:00 em Brasilia, alvo 18:30
    - cron: "0 19 * * *"
    - cron: "50 19 * * *"
    - cron: "40 20 * * *"
    - cron: "20 21 * * *"
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # se uma rodada atrasar e encostar na outra, a segunda espera em vez
  # de rodar junto e baguncar o historico
  group: post-diario
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    # o espera.py dorme no maximo 2h30; o resto e a propria publicacao
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow

      - name: Esperar a hora certa
        id: relogio
        env:
          FORCAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python espera.py

      - name: Gerar e publicar
        if: steps.relogio.outputs.publicar == 'sim'
        env:
          ID: ${{ secrets.IG_USER_ID }}
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python postador.py

      - name: Avisar se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Agora sao varias tentativas por janela. Se algo quebrou de
          # verdade, todas falham, e sem este filtro a caixa de entrada
          # recebe uma duzia de avisos do mesmo problema. Um por dia.
          TITULO="O post de $(date -u +%F) falhou"
          if gh issue list --state open --search "$TITULO in:title" \
               --json title --jq '.[].title' | grep -qxF "$TITULO"; then
            echo "Ja existe aviso aberto para hoje. Nao vou duplicar."
            exit 0
          fi
          gh issue create             --title "$TITULO"             --body "A rodada automatica nao publicou.

          Veja o log em: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Causas mais comuns, em ordem:
          1. Token do Instagram expirado. Gere outro no Business Manager e
             atualize o segredo IG_ACCESS_TOKEN.
          2. Credito da OpenAI acabou. Veja em platform.openai.com.
          3. A Meta recusou a imagem ou esta fora do ar. Costuma passar
             sozinho na proxima rodada." || true

      - name: Guardar historico e pautas
        run: |
          git config user.name "FisioSync Robo"
          git config user.email "robo@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add historico.json pautas.json || true
          git commit -m "registro do post de $(date -u +%F-%H%M)" || exit 0
          git push
